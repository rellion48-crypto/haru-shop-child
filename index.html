<body>

<!-- 태그 관리자 코드가 들어갈 자리 (몸통 맨 위) -->

<!-- 상단 알림 배너 -->
<div class="top-notice-bar">
  <span>🚚 <strong>오늘 오후 2시 전 주문 시 당일 발송</strong> · 3만 원 이상 무료 배송 / 신선 안심 보냉팩 포장</span>
</div>

<header class="site"><div class="wrap">
  <a class="brand" href="index.html">간편한 식사(간식)</a>
  <nav class="site">
    <a href="index.html">상품</a>
    <a href="about.html">가게 소개</a>
    <a href="shipping.html">배송·교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
  </nav>
</div></header>

<section class="hero"><div class="wrap">
  <div class="hero-badge">
    <span class="badge-dot"></span>
    <span>✨ 1인가구 & 자취생 필수 간편 밀키트</span>
  </div>
  <h1 id="hero-title">간편한 식사(간식)</h1>
  <p id="hero-tagline">간편하게 넣고 끓이기만 하면 되는 밀키트를 판매합니다.</p>
  <div class="hero-features">
    <div class="feature-item">
      <span class="feature-icon">⚡</span>
      <span class="feature-text"><strong>10분 초간편</strong> 조리</span>
    </div>
    <div class="feature-item">
      <span class="feature-icon">🍲</span>
      <span class="feature-text"><strong>1인분 소분</strong> 잔반 걱정 0%</span>
    </div>
    <div class="feature-item">
      <span class="feature-icon">🧊</span>
      <span class="feature-text"><strong>신선 보냉</strong> 안심 발송</span>
    </div>
  </div>
</div></section>

<main><div class="wrap">
  <div class="section-header">
    <div>
      <h2>오늘의 간편식 메뉴</h2>
      <p class="lead">재료 손질 없이 냄비에 넣고 끓이기만 하면 완성되는 따뜻한 밀키트입니다.</p>
    </div>
    <div class="category-pills">
      <button class="pill active" data-filter="all">전체 메뉴</button>
      <button class="pill" data-filter="soup">국물·찌개</button>
      <button class="pill" data-filter="dish">요리·분식</button>
    </div>
  </div>
  <div class="grid" id="product-list"></div>
</div></main>

<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script>
  // 카테고리 필터 인터랙션 연출
  document.addEventListener("DOMContentLoaded", () => {
    const pills = document.querySelectorAll(".category-pills .pill");
    pills.forEach(pill => {
      pill.addEventListener("click", () => {
        pills.forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
        const filter = pill.dataset.filter;
        const cards = document.querySelectorAll("#product-list .card");
        cards.forEach(card => {
          const text = card.textContent;
          if (filter === "all") {
            card.style.display = "";
            card.style.animation = "cardFadeIn 0.35s ease forwards";
          } else if (filter === "soup" && (text.includes("찌개") || text.includes("전골"))) {
            card.style.display = "";
            card.style.animation = "cardFadeIn 0.35s ease forwards";
          } else if (filter === "dish" && (text.includes("떡볶이") || text.includes("닭갈비"))) {
            card.style.display = "";
            card.style.animation = "cardFadeIn 0.35s ease forwards";
          } else {
            card.style.display = "none";
          }
        });
      });
    });
  });
</script>
</body>
</html>
