<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Consent Mode 기본값 (태그 관리자보다 앞에 있어야 합니다) -->
  <script src="assets/consent.js"></script>

  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-N3T4GNMF');</script>
  <!-- End Google Tag Manager -->

  <title>로그인</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .login-box { max-width: 360px; margin: 48px auto; padding: 0 16px; }
    .login-box label { display: block; margin-top: 16px; font-weight: 600; }
    .login-box input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px; font-size: 16px; }
    .login-actions { display: flex; gap: 8px; margin-top: 20px; }
    .login-actions button { flex: 1; padding: 10px; font-size: 16px; cursor: pointer; }
    .login-note { margin-top: 12px; font-size: 12px; color: #6b7280; }
    #auth-message { margin-top: 20px; min-height: 1.5em; }
    #auth-message.error { color: #c0392b; }
  </style>
</head>

<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N3T4GNMF"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <header class="site">
    <div class="wrap">
      <a class="brand" href="index.html">간편한 식사(간식)</a>
      <nav class="site">
        <a href="index.html">상품</a>
        <a href="about.html">가게 소개</a>
        <a href="shipping.html">배송·교환</a>
        <a href="cart.html">장바구니</a>
        <span class="auth-nav" id="auth-nav"></span>
      </nav>
    </div>
  </header>

  <main>
    <form class="login-box" id="auth-form" novalidate>
      <h1>로그인</h1>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="email">
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password">
      <div class="login-actions">
        <button type="button" id="btn-signup">가입</button>
        <button type="submit" id="btn-login">로그인</button>
        <button type="button" id="btn-logout">로그아웃</button>
      </div>
      <p class="login-note">도서관이나 학교처럼 같이 쓰는 컴퓨터에서는, 간식상점을 다 보신 뒤 로그아웃을 눌러 주세요.</p>
      <p id="auth-message" role="status"></p>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    // index.html 에 있는 설정과 같은 값
    const firebaseConfig = {
      apiKey: "AIzaSyAopBL38Hpv4C7VIDG1Od8V6DGPh6wc1Ws",
      authDomain: "gansik-shop.firebaseapp.com",
      projectId: "gansik-shop",
      storageBucket: "gansik-shop.firebasestorage.app",
      messagingSenderId: "860199711922",
      appId: "1:860199711922:web:1f268269d214a3b3fc45ab"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("auth-message");

    function show(text, isError) {
      message.textContent = text;
      message.className = isError ? "error" : "";
    }

    function showError(err) {
      // 화면에는 오류 코드(auth/...)만 보여 준다
      show(err && err.code ? err.code : "오류가 발생했습니다", true);
    }

    document.getElementById("btn-signup").addEventListener("click", async () => {
      try {
        const cred = await createUserWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        show("가입 완료: " + cred.user.email, false);
        // 통로가 이미 있으면 그대로 쓰고, 없을 때만 새로 만든다
        window.dataLayer = window.dataLayer || [];
        // 가입이 성공한 순간 한 번만 넣는다 - 이메일 주소와 비밀번호는 넣지 않는다
        dataLayer.push({
          // 무슨 일이 일어났나 - 계획서 이름 글자 그대로
          event: "sign_up",
          // 가입 방법 - 이메일
          method: "email"
        });
      } catch (err) {
        showError(err);
      }
    });

    document.getElementById("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const cred = await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        show("로그인 완료: " + cred.user.email, false);
        // mypage.html 에서 돌려보내졌으면 원래 가려던 화면으로 보낸다 (같은 사이트의 .html 이름만 허용)
        const next = new URLSearchParams(location.search).get("next");
        if (next && /^[\w-]+\.html$/.test(next)) location.href = next;
      } catch (err) {
        showError(err);
      }
    });

    document.getElementById("btn-logout").addEventListener("click", async () => {
      try {
        await signOut(auth);
        show("로그아웃 완료", false);
      } catch (err) {
        showError(err);
      }
    });
  </script>
  <script type="module" src="assets/auth.js"></script>
</body>

</html>
